[pytest]
DJANGO_SETTINGS_MODULE = config.settings.test
python_files = test_*.py
testpaths = apps

# --reuse-db keeps the schema between runs. The bookings schema includes a
# hand-written MySQL generated column (0003_partial_unique_slot), so rebuilding
# it on every run is slow for no benefit. Pass --create-db after a migration.
addopts = --reuse-db --strict-markers -q

markers =
    slow: tests that spawn threads or real database connections
